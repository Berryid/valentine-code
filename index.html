<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Valentine's Day! ❤️</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <div class="container">
        <div id="media-container">
            <div id="loading">Loading our memories...</div>
            <button id="muteBtn" style="display: none;">🔇</button>
        </div>
        
        <h1 id="main-text">Happy Valentine's Day! ❤️</h1>
        <p id="sub-text">I made this just for you.</p>
        
        <div class="buttons">
            <button id="yesBtn">Open Gift 🎁</button>
            <button id="noBtn">Exit ❌</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
